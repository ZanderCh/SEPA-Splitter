# Tests und portable Pakete für Windows, Linux (x86_64) und macOS (arm64 + Intel).
# Jeder Job ruft das Build-Skript des Projekts auf; dieses führt zuerst alle Tests aus
# (Kern + GUI, offscreen) und bricht bei Fehlern ab. Die Pakete landen als Artefakte am Lauf.
name: Tests und Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows-x64
            os: windows-latest
          - name: Linux-x86_64
            os: ubuntu-22.04        # bewusst älteres System: glibc 2.35 als Mindestanforderung
          - name: macOS-arm64
            os: macos-15
          - name: macOS-x86_64
            os: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Qt-Systembibliotheken (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libfontconfig1 libdbus-1-3 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0

      - name: Tests und Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: bash build/build_unix.sh

      - name: Tests und Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./build/build_windows.ps1

      - name: Paket-Starttest (Kommandozeile, ohne INI, fremdes Arbeitsverzeichnis)
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(ls -d dist/SEPA-Splitter-*)"
          case "$RUNNER_OS" in
            Windows) EXE="$OUT/SEPA-Splitter.exe"; APPDIR="$OUT" ;;
            macOS)   EXE="$OUT/SEPA-Splitter.app/Contents/MacOS/SEPA-Splitter"; APPDIR="$OUT" ;;
            *)       EXE="$OUT/SEPA-Splitter"; APPDIR="$OUT" ;;
          esac
          EXE="$(cd "$(dirname "$EXE")" && pwd)/$(basename "$EXE")"
          APPDIR="$(cd "$APPDIR" && pwd)"
          mv "$APPDIR/SEPA-Splitter.ini" "$RUNNER_TEMP/ini.bak"
          mkdir -p "$RUNNER_TEMP/probe" && cp samples/beispiel_008_02_2000tx.xml "$RUNNER_TEMP/probe/"
          cd "$RUNNER_TEMP"
          "$EXE" --cli "$RUNNER_TEMP/probe/beispiel_008_02_2000tx.xml" --check
          test -f "$APPDIR/SEPA-Splitter.ini"     # INI wurde neben der Anwendung angelegt
          mv "$RUNNER_TEMP/ini.bak" "$APPDIR/SEPA-Splitter.ini"

      # Archivieren vor dem Hochladen: erhält Ausführungsrechte und die Symlinks im macOS-Bundle.
      - name: Paket archivieren (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist && D="$(ls -d SEPA-Splitter-*)" && tar -czf "$D.tar.gz" "$D"
      - name: Paket archivieren (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist && D="$(ls -d SEPA-Splitter-*)" && ditto -c -k --sequesterRsrc --keepParent "$D" "$D.zip"
      - name: Paket archivieren (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\SEPA-Splitter-Windows -DestinationPath dist\SEPA-Splitter-Windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: SEPA-Splitter-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30
